<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - Marcin Kwaśny</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">O mnie</a>
        <a href="ranking.html">Ranking filmów z 2026 roku</a>
        <a href="kontakt.html" class="active">Kontakt</a>
    </nav>
    <main>

        <section class="hero-card">
            <h1>Zostaw swoją opinię</h1>
            <p>Podziel się swoimi wrażeniami na temat strony lub mojego rankingu.</p>
            <p>Daj znać, z czym się zgadzasz, co byś zmienił i jakie filmy wyrzucił, a co dodał!</p>
        </section>
        <form action="#" method="POST" class="glass-form">
    <label for="email" > Twój email:</label>
    <input type="email" id="email" name="email" required placeholder="np. jankowalski@example.com">

    <label for="subject">Temat wiadomości:</label>
    <select id='subject' name="subject" required>
        <option value="">Wybierz temat</option>
        <option value="opinia">Opinia o stronie</option>
        <option value="ranking">Opinia o rankingu</option>
        <option value="inne">Inne</option>
    </select>
 
    <label for="message">Wiadomość:</label>
    <textarea id="message" name="message" rows="5" required placeholder="Napisz swoją wiadomość tutaj..."></textarea>
    
    <button type="submit">Wyślij</button>
</form>
    </main>
    <footer>
        <p>Marcin Kwaśny - Projekt WdAI</p>
        <a href="https://www.instagram.com/marcin_kwasny/" target="_blank">
            <img src="ig-logo.png" alt ="Mój Instagram">
        </a>
    </footer>
